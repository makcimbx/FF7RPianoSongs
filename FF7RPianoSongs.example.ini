[General]
Enabled=1
LogLevel=info

[Autoplay]
; Ctrl + F1..F12 toggles autoplay while seated at a piano; 0 disables the keyboard shortcut.
KeyboardFunctionKey=8

[Preview]
; auto: play after dwelling on a custom song; manual: shortcut only; off: disable previews.
Mode=auto
; Ctrl + F1..F12 toggles preview in the song list; 0 disables the keyboard shortcut.
KeyboardFunctionKey=7

[Theme]
; Theme directories and selector format: docs/MenuThemes.md. "original" restores native styling.
Selected=original
; Ctrl + F1..F12 cycles themes; 0 disables only the keyboard shortcut.
; Gamepad: hold L3, tap L2 for previous or R2 for next. Both triggers suppress switching.
KeyboardFunctionKey=6

[Advanced]
RebuildAudioCache=0
; CPU threads for transcribing the piano of songs without song.mid.
TranscriptionThreads=4

name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    runs-on: windows-2022
    timeout-minutes: 60

    # One ASI supports one game build, so every supported build is validated end to end.
    # `catalog_id` selects the generated tree (build.ps1 -CatalogBuildId); `game_build`
    # selects the release.json target (package_dist.ps1). Supporting another build is a
    # data-only edit here once rva_catalog.json and release.json declare it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - catalog_id: ff7rebirth-steam-win64-6a16ced2
            game_build: "1.005"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Release
        shell: pwsh
        run: ./build.ps1 -Configuration Release -CatalogBuildId ${{ matrix.catalog_id }}

      - name: Validate RVA catalog
        shell: pwsh
        run: ./tools/check_rva_catalog.ps1

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Audit source
        shell: pwsh
        run: ./build/Release/release_audit_tool.exe .

      - name: Stage deterministic package
        shell: pwsh
        run: ./package_dist.ps1 -Configuration Release -SkipBuild -GameBuild ${{ matrix.game_build }}

      - name: Audit staged documentation
        shell: pwsh
        run: ./build/Release/release_audit_tool.exe . --staged-docs ./package
